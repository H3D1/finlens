spring.application.name=aggregation-service

# Database connection — values come from environment variables (set by docker-compose or local env)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:finlens}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=this-is-a-very-long-jwt-signing-secret-for-finlens-development-1234567890
jwt.expiration-ms=3600000